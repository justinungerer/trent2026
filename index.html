<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111b1c">
<title>Trent Saves Christmas</title>
<style>
:root{color-scheme:dark;--paper:#fff0cc;--gold:#e6b56b;--ink:#151e1d;--line:#535348;--muted:#bdb8a3}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#2b3933,#111819 70%);color:var(--paper);font:16px/1.5 system-ui,sans-serif}
main{max-width:690px;margin:auto;padding:20px clamp(14px,4vw,30px) 36px}
header,.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wordmark,.eyebrow,#track{font-size:.73rem;text-transform:uppercase;letter-spacing:.15em;font-weight:800;color:var(--gold)}
#track{text-align:right}
figure{margin:14px 0 0;position:relative;border:1px solid #877456;border-radius:12px 12px 0 0;overflow:hidden;background:#172427}
canvas{display:block;width:100%;height:auto;aspect-ratio:2/1}
figcaption{position:absolute;bottom:0;left:0;padding:5px 12px;background:#121c1deb;font-size:.67rem;letter-spacing:.13em;text-transform:uppercase;color:#e9cf9f}
article{border:1px solid #6d654e;border-top:0;border-radius:0 0 12px 12px;background:linear-gradient(#27312b,#1c2523);padding:clamp(16px,4vw,27px);box-shadow:0 15px 40px #0005}
h1,h2{font-family:Georgia,serif;font-weight:700;line-height:1.07;margin:8px 0 12px;text-wrap:balance}
h1{font-size:clamp(2rem,7vw,3.6rem)}h2{font-size:clamp(1.48rem,5vw,2.25rem)}
p{margin:0 0 14px;color:#e1d9c1}
#options,#moves{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
button{min-height:46px;border:1px solid #6a6d57;border-radius:6px;background:#354137;color:var(--paper);padding:9px 12px;font:inherit;font-weight:700;cursor:pointer;text-align:left;touch-action:manipulation}
button:hover:not(:disabled){background:#465747}
button:focus-visible{outline:3px solid #ffce7a;outline-offset:2px}
button:disabled{opacity:.58;cursor:default}
button.right{opacity:1;background:#365b43;border-color:#a2d0a3}
button.wrong{opacity:1;background:#683e37;border-color:#f5a987}
.primary{background:var(--gold);color:#191d16;border-color:var(--gold);text-align:center;width:100%}
.primary:hover:not(:disabled){background:#ffcf84}
#feedback{font-size:.94rem;margin:14px 0 4px}
.result{overflow:hidden;border:1px solid #9a7950;border-radius:9px;background:#192523;animation:card-in .32s ease-out both}
.result.wrong-result{border-color:#c2816b}
.result-stage{overflow:hidden;background:radial-gradient(ellipse at 50% 85%,#78573a,#273e37 53%,#131e20 100%)}
.result-stage canvas{aspect-ratio:3.5/1;transform-origin:50% 85%;animation:hop .62s cubic-bezier(.2,.65,.4,1) both}
.result-copy{padding:12px 14px 2px}
.result-copy strong{display:block;color:#f3c986;font-size:1.13rem;margin-bottom:4px}
.result-copy p{margin-bottom:10px}
.explanation{color:#bcbba6;font-size:.83rem}
#next{margin-top:8px}
.guide{padding:0;margin:14px 0 18px;list-style:none;display:grid;gap:8px}
.guide li{padding:8px 11px;border-left:2px solid var(--gold);background:#172420;color:#e1d9c1}
.guide strong{color:#fff0cc}
@keyframes card-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes hop{0%{opacity:0;transform:translateY(48%) scale(.75,.55)}38%{opacity:1;transform:translateY(-10%) scale(.95,1.13)}64%{transform:translateY(3%) scale(1.10,.88)}82%{transform:translateY(-3%) scale(.98,1.04)}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.result,.result-stage canvas{animation:none}}
#strikes{color:#eed6ad;font-size:.78rem;white-space:nowrap}
#moves{grid-template-columns:1fr 1fr 1fr}
#moves button{text-align:center;font-size:.9rem;padding-inline:4px}
small{color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header><span class="wordmark">Trent Saves Christmas</span><span id="track">Prototype</span></header>
<figure><canvas id="scene" width="800" height="400" role="img" aria-label="Animated illustration"></canvas><figcaption id="caption"></figcaption></figure>
<article id="panel"></article>
</main>
<script>
const questions = [
 {level:'Easy',scene:'radio',caption:'Field radio',title:'What does SOS signal?',choices:['A request for emergency help','A change of radio frequency','A shipment has arrived','An order to turn off the radio'],answer:0,explain:'SOS is a distress signal.',win:'Sprout gets through. “I’m on the third shelf. Tell my family I died alphabetical.”',miss:'Trent calls the base canteen by accident. Someone puts him on hold to count potatoes.'},
 {level:'Medium',scene:'convoy',caption:'Atlantic crossing',title:'Why did Allied merchant ships sail in convoys?',choices:['To navigate by following the fastest ship','To get protection from attacks','To unload cargo while at sea','To save fuel by following the tide'],answer:1,explain:'Grouping ships allowed escorts to protect them.',win:'Sprout spots an opening while the guards bunch up at the tea trolley.',miss:'Trent cracks a floorboard. The guard starts his sweep one shelf closer.'},
 {level:'Hard',scene:'cipher',caption:'Codebreaking room',title:'Which wartime machine helped British codebreakers find Enigma settings?',choices:['Colossus','Lorenz','Bombe','ENIAC'],answer:2,explain:'The Bombe helped narrow down possible Enigma settings.',win:'Trent opens the case. Sprout has already packed an overnight bag.',miss:'The lock clicks open, but Trent drops a battery. The Shelf Shuffler gets one charge instead of two.'}
];
const panel=document.querySelector('#panel'), track=document.querySelector('#track'), caption=document.querySelector('#caption');
const canvas=document.querySelector('#scene'), sceneContext=canvas.getContext('2d');
let ctx=sceneContext;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let resultArt=null, resultSince=0;
let mode='intro', current=0, strikes=0, position=0, lamp=2, phase=0, battery=2, closer=false, charges=2, armed=false;
const shelfNames=['Display case','Toy shelf','File shelf','Mail hatch'];
const patrol=[2,1,3,0];
function show(html){resultArt=null;panel.innerHTML=html}
function heading(text){return '<h2 tabindex="-1">'+text+'</h2>'}
function focusHeading(){panel.querySelector('h1,h2')?.focus({preventScroll:true})}
function bind(id,action){document.getElementById(id).onclick=action}
function meter(){return '<span id="strikes">Strikes '+strikes+' / 3</span>'}
function intro(){
 mode='intro'; current=0; strikes=0; closer=false; battery=2;
 track.textContent='Prototype'; caption.textContent='Occupied rail depot · Christmas Eve';
 show('<div class="eyebrow">Chapter 3</div><h1 tabindex="-1">Get Sprout<br>off the Shelf</h1><p>The Nazis caught the Elf on the Shelf spying. He’s locked in a display case between a medal and a mug that says <em>World’s Best Colonel</em>. He knows where they’re holding Santa.</p><button class="primary" id="start">Start the rescue</button>');
 bind('start',quiz);
}
function quiz(){
 mode='quiz';
 const q=questions[current];
 track.textContent='Question '+(28+current)+' / 30';
 caption.textContent=q.caption;
 show('<div class="row"><span class="eyebrow">'+q.level+'</span>'+meter()+'</div>'+heading(q.title)+'<div id="options">'+q.choices.map((choice,i)=>'<button data-choice="'+i+'">'+choice+'</button>').join('')+'</div><div id="feedback" role="status"></div><button class="primary" id="next" hidden>Continue</button>');
 focusHeading();
 panel.querySelectorAll('[data-choice]').forEach(button=>button.onclick=()=>answer(Number(button.dataset.choice)));
}
function answer(choice){
 const q=questions[current], correct=choice===q.answer;
 if(!correct){
  strikes++;
  if(current===1)closer=true;
  if(current===2)battery=1;
 }
 panel.querySelectorAll('[data-choice]').forEach((button,i)=>{
  button.disabled=true;
  if(i===q.answer){button.classList.add('right');button.setAttribute('aria-label',button.textContent+', correct answer')}
  else if(i===choice)button.classList.add('wrong');
 });
 document.querySelector('#strikes').textContent='Strikes '+strikes+' / 3';
 const title = (correct?['Signal received','A gap in the patrol','The case is open']:['Wrong number','Flashlight closing in','One charge lost'])[current];
 const feedback=document.querySelector('#feedback');
 feedback.innerHTML='<div class="result '+(correct?'':'wrong-result')+'"><div class="result-stage"><canvas width="700" height="200" aria-hidden="true"></canvas></div><div class="result-copy"><strong>'+(correct?'Correct · ':'Wrong answer · ')+title+'</strong><p>'+(correct?q.win:q.miss)+'</p><p class="explanation">'+q.explain+'</p></div></div>';
 resultArt={canvas:feedback.querySelector('canvas'),key:current*2+Number(!correct)};
 resultSince=performance.now();
 drawResult(0);
 const next=document.querySelector('#next');
 next.hidden=false;
 next.textContent=strikes===3?'See mission result':current===2?'How to play Shelf Escape':'Next question';
 next.onclick=()=>{
  if(strikes===3)finish(false);
  else if(current===2)instructions();
  else{current++;quiz()}
 };
 next.focus({preventScroll:true});
 if(next.getBoundingClientRect().bottom>window.innerHeight)feedback.scrollIntoView({block:'start',behavior:reduced?'instant':'smooth'});
}
function instructions(){
 mode='guide';
 track.textContent='Shelf Escape'; caption.textContent='Guard room';
 show('<div class="eyebrow">How to play</div>'+heading('Shelf Escape')+'<p>Find Sprout’s display case, then escort him to the mail hatch.</p><ul class="guide"><li><strong>Move</strong> using the thumbstick or arrow keys.</li><li><strong>Hide</strong> behind shelves while the guards patrol. Exposure fills the alert meter.</li><li><strong>Shelf Shuffler</strong> throws a wind-up nutcracker ahead to distract nearby guards. You have '+battery+' '+(battery===1?'charge':'charges')+'.</li></ul><p><small>If you’re caught, you can retry Shelf Escape with the same quiz progress.</small></p><button class="primary" id="begin-escape">Start Shelf Escape</button>');
 bind('begin-escape',launchStealth);focusHeading();window.scrollTo(0,0);
}
function launchStealth(){
 mode='stealth';
 track.textContent='Shelf Escape';
 document.querySelector('figure').hidden=true;
 show('<iframe id="stealth" title="Shelf Escape stealth game" style="width:100%;height:76vh;height:76dvh;border:0;display:block"></iframe>');
 const iframe=document.querySelector('#stealth');
 const mission=new URL('./shelf-escape/',location.href);
 mission.searchParams.set('charges',battery);
 if(closer)mission.searchParams.set('patrol','close');
 mission.searchParams.set('parentOrigin',location.origin);
 const runId=String(Date.now());
 function receive(event){
  if(event.origin!==mission.origin||event.source!==iframe.contentWindow||event.data?.version!==1||event.data.mission!=='shelf-escape')return;
  if(event.data.type==='trent:ready')iframe.contentWindow.postMessage({type:'trent:init',version:1,runId},mission.origin);
  if(event.data.type==='trent:complete'&&event.data.runId===runId){
   window.removeEventListener('message',receive);
   document.querySelector('figure').hidden=false;
   finish(true);window.scrollTo(0,0);
  }
 }
 window.addEventListener('message',receive);
 iframe.src=mission.href;
 window.scrollTo(0,0);
}
function finish(won){
 mode=won?'win':'fail';
 track.textContent=won?'Elf rescued':'Mission failed';
 caption.textContent=won?'Away from the guard room':'Occupied rail depot';
 show('<div class="eyebrow">'+(won?'Chapter complete':'Three strikes')+'</div>'+heading(won?'Sprout is off the shelf':'Mission failed')+'<p>'+(won?'“I know where they took Santa,” says Sprout. “And I stole their stapler. Both things felt important.”':'The quartermaster transfers Trent to the Arctic Weather Office. His first assignment is to confirm it is cold.')+'</p>'+(won?'<p><small>Next chapter: Quinn’s secret toy shop.</small></p>':'')+'<button class="primary" id="replay">Replay prototype</button>');
 bind('replay',()=>{intro();focusHeading()});focusHeading();
}
function box(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(x,y,w,h)}
function oval(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function poly(points,color){ctx.fillStyle=color;ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill()}
function gradient(top,bottom){const g=ctx.createLinearGradient(0,0,0,400);g.addColorStop(0,top);g.addColorStop(1,bottom);box(0,0,800,400,g)}
function label(text,x,y,size,color){ctx.font='700 '+size+'px monospace';ctx.fillStyle=color;ctx.fillText(text,x,y)}
function snow(t){for(let i=0;i<90;i++){const x=(i*127+t*(14+i%12))%820,y=(i*73+t*(20+i%17))%400;oval(x,y,1+i%3/2,1+i%3/2,'#f3e8cb66')}}
function elf(x,y,scale){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 oval(0,26,38,7,'#10171988');
 poly([[-25,0],[0,-24],[26,0],[20,29],[-22,29]],'#b74b42');
 poly([[-25,-3],[0,9],[25,-3],[18,-10],[0,1],[-17,-10]],'#ffe0ab');
 oval(0,-26,19,20,'#edb78d');oval(-19,-25,6,7,'#daa184');oval(19,-25,6,7,'#daa184');
 poly([[-22,-38],[4,-74],[25,-40]],'#b44942');oval(4,-73,7,7,'#eee1ba');box(-22,-42,45,8,'#f4dcab');
 oval(-6,-27,1.8,2.8,'#242523');oval(7,-27,1.8,2.8,'#242523');oval(2,-17,5,2,'#995a4b');
 ctx.restore();
}
function room(t,active){
 gradient('#18292d','#564737');
 box(0,302,800,98,'#282b26');
 box(0,300,800,6,'#ad8152');
 for(let i=0;i<4;i++){
  const x=25+i*195;
  box(x,58,166,220,'#161c1c');box(x+6,64,154,207,'#33362e');
  box(x+6,129,154,5,'#72563b');box(x+6,192,154,6,'#946a47');
  for(let j=0;j<4;j++){const h=15+(i*17+j*23)%36;box(x+14+j*32,126-h,25,h,['#71684d','#675144','#8a6b48','#4a6659'][j]);}
  label(['DISPLAY','TOYS','FILES','MAIL'][i],x+13,253,19,'#b6a579');
 }
 const beam=active ? 108+lamp*195 : 393+Math.sin(t*.8)*300;
 const g=ctx.createRadialGradient(beam,155,1,beam,155,114);g.addColorStop(0,'#ffe4a580');g.addColorStop(1,'#ffe4a500');oval(beam,155,114,114,g);
 poly([[795,63],[beam-64,140],[beam+64,187]],'#ffe29a25');
 if(mode==='win'){elf(400,247,2);snow(t)}
 else{const slot=active?position:0;elf(103+slot*195,178+(armed?0:Math.sin(t*3)*2),.83);if(armed&&active)elf(109+lamp*195,177,.65)}
 if(!active&&mode!=='win'){box(32,136,151,63,'#c2e9ff14');poly([[42,139],[56,139],[94,195],[81,195]],'#f0eafa22')}
}
function radio(t){
 gradient('#172929','#66523a');box(0,318,800,82,'#34291f');
 box(150,117,500,211,'#252920');box(163,129,474,184,'#63634c');box(178,143,444,147,'#383e32');
 box(207,162,201,91,'#b4743b');box(215,169,185,76,'#dfad65');
 for(let i=0;i<18;i++)box(226+i*9,185,2,i%3===0?28:14,'#473826');
 box(302+Math.sin(t*2)*42,178,3,55,'#95382b');
 for(let i=0;i<16;i++)box(441,151+i*8,72,2,'#272f29');
 const glow=ctx.createRadialGradient(307,206,10,307,206,170);glow.addColorStop(0,'#fec76f44');glow.addColorStop(1,'#fec76f00');oval(307,206,170,170,glow);
 for(let i=0;i<22;i++)oval((i*71+t*7)%800,45+i*53%274,1.4,1.4,'#ffdda437');label('FIELD SET',223,236,15,'#533623');
 for(let i=0;i<3;i++){oval(458+i*62,219,24,24,'#242923');oval(458+i*62,216,17,17,'#777258')}
 oval(601,157,5,5,Math.sin(t*4)>0?'#f5ca72':'#67553b');
}
function convoy(t){
 gradient('#23313b','#a68d70');oval(607,91,32,32,'#e8caa0');
 box(0,168,800,232,'#304e56');
 for(let i=0;i<7;i++){const x=((i*141+t*(4+i%3))%1000)-100;oval(x,61+i%3*22,76,12,'#dfc6a533');}
 for(let i=0;i<16;i++){const y=171+i*14;const x=(i*71+t*(9+i))%940-70;poly([[x,y],[x+120+i*4,y-2],[x+154,y+4],[x+19,y+5]],i%2?'#44656b':'#6b8a8a44');}
 for(let k=0;k<3;k++){
  const x=76+k*238+Math.sin(t*.8+k)*12,y=190+k*43+Math.sin(t*2+k)*6;
  poly([[x,y],[x+193,y],[x+159,y+37],[x+24,y+37]],'#212f33');
  box(x+51,y-23,72,23,'#737366');box(x+72,y-47,20,24,'#414649');box(x+141,y-56,3,56,'#333b3b');
  for(let j=0;j<5;j++)oval(x+91-j*11+Math.sin(t+j)*4,y-52-j*7,4+j*2,3+j*2,'#b5a79825');
 }
 for(let i=0;i<30;i++){const x=(i*97+t*17)%800,y=210+i*31%185;oval(x,y,11+i%7*5,1.3,'#c2d4cf50')}
}
function cipher(t){
 gradient('#252522','#705240');box(0,335,800,65,'#271b17');
 box(173,104,454,239,'#473221');box(187,116,425,212,'#6c5840');
 for(let row=0;row<3;row++)for(let col=0;col<8;col++){
  const x=222+col*50,y=151+row*59;
  oval(x,y,20,20,'#282923');oval(x,y,15,15,'#a18759');
  ctx.save();ctx.translate(x,y);ctx.rotate((col+row)*.4+Math.sin(t+col)*.6);box(-1,-15,3,10,'#efce8a');ctx.restore();
  label(String.fromCharCode(65+(col+row*8)%26),x-5,y+5,14,'#342e22');
  oval(x+21,y-17,3,3,Math.sin(t*5+row*7+col)>.55?'#ffd88c':'#69513a');
 }
}
function drawResult(t){
 const {canvas:illustration,key}=resultArt;
 ctx=illustration.getContext('2d');
 ctx.clearRect(0,0,700,200);
 for(let i=0;i<34;i++){
  const x=86+(i*137)%528,y=22+(i*73)%157;
  oval(x,y,1+i%3/2,1+i%3/2,'rgba(255,222,154,'+(.13+.11*Math.sin(t*2+i))+')');
 }
 oval(350,173,147,12,'#0c15158c');
 ctx.save();ctx.translate(350,106);
 const sway=Math.sin(t*3), twinkle=Math.sin(t*7);
 switch(key){
  case 0:
   elf(12,30,1.25);
   box(-128,4,56,47,'#212f29');box(-122,10,43,31,'#818668');box(-118,-45,3,49,'#c7ab75');
   for(let i=0;i<3;i++)oval(-66-i*13,-38-i*10,3+i,3+i,twinkle>i/4?'#ffda83':'#896744');
   break;
  case 1:
   ctx.rotate(sway*.07);oval(0,32,55,25,'#623830');oval(0,25,53,21,'#a34d3e');
   poly([[-85,17],[-64,-19],[-30,-28],[27,-28],[62,-17],[83,18],[60,29],[45,1],[-44,1],[-61,28]],'#d56850');
   oval(89,-27,17,11,'#c09a68');oval(112,0,17,11,'#d6af7c');oval(106,30,17,11,'#ab835b');
   break;
  case 2:
   box(-129,-1,260,12,'#543c28');
   for(let i=-1;i<=1;i++){const x=i*69;oval(x,10,19,7,'#d4c193');box(x-12,-16,24,25,'#f2d7a5');oval(x,-16,12,4,'#865636');oval(x+14,-5,5,6,'#c89d73');}
   elf(0,40,.64);
   for(let i=0;i<3;i++)oval(-72+i*70+sway*3,-34-i*5,6,9,'#eed9a84a');
   break;
  case 3:
   ctx.rotate(sway*.14);
   poly([[-78,-23],[-78,24],[-21,18],[-21,-17]],'#526354');
   box(-143,-13,71,27,'#78816a');oval(-23,0,8,18,'#ffda8b');
   poly([[-22,-16],[143,-63],[143,64],[-22,16]],'#ffdf8680');elf(93,24,.68);
   break;
  case 4:
   box(-89,-39,178,92,'#ad86512e');box(-89,45,178,8,'#b08b61');box(-89,-39,5,84,'#ceb188');
   poly([[88,-39],[143,-63],[143,64],[88,53]],'#d3edcf50');
   elf(0,30,1.11);box(38,17,35,28,'#785036');box(48,12,15,6,'#cf965d');
   break;
  case 5:
   box(-118,-31,107,68,'#783e34');box(-107,-21,85,51,'#a55b3e');box(-69,-42,55,11,'#d6a26d');label('SHUFFLER',-107,11,13,'#fff0cc');
   ctx.translate(53,18);ctx.rotate(sway*.35-.32);box(-33,-16,63,32,'#c7a257');box(-25,-16,32,32,'#526354');box(30,-7,7,14,'#ded6a0');label('−1',-9,-33,27,'#ffe19b');
   break;
 }
 ctx.restore();
 ctx=sceneContext;
}
function paint(ms){
 const t=reduced?0:ms/1000;
 if(mode==='quiz'){const art=questions[current].scene;if(art==='radio')radio(t);else if(art==='convoy')convoy(t);else cipher(t)}
 else room(t,mode==='escape');
 const shade=ctx.createRadialGradient(400,180,105,400,200,470);
 shade.addColorStop(0,'#18171200');shade.addColorStop(1,'#101817a8');box(0,0,800,400,shade);
 if(resultArt&&!reduced)drawResult(Math.max(0,(ms-resultSince)/1000));
}
let last=-Infinity;
function animate(ms){if(ms-last>=32){paint(ms);last=ms}requestAnimationFrame(animate)}
const observer=new MutationObserver(()=>{canvas.setAttribute('aria-label',caption.textContent);if(reduced)paint(0)});
observer.observe(panel,{childList:true,subtree:true});
intro();paint(0);if(!reduced)requestAnimationFrame(animate);
</script>
</body>
</html>
